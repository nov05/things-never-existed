<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Things Never Existed</title>
    <meta name="description" content="Things Never Existed — AI fantasy short videos.">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Header -->
    <header class="site-header">
        <div class="header-content">
            <a href="https://nov05.github.io/things-never-existed/">
                <img src="assets/logo.jpg" alt="Things Never Existed" class="logo">
            </a>
            <h1>Things Never Existed</h1>
        </div>
    </header>

    <main class="container">
        <!-- Search -->
        <div class="search-wrapper">
            <input type="search" id="search" placeholder="Search..." autocomplete="off">
        </div>

        <!-- Series -->
        <nav id="series" class="series-nav" aria-label="Video series"></nav>

        <!-- Current filter -->
        <h2 id="title">All Videos</h2>

        <!-- Video Grid -->
        <section id="videos" class="video-grid" aria-live="polite"></section>

        <!-- Pagination -->
        <nav id="pagination" class="pagination" aria-label="Pagination"></nav>
    </main>

    <!-- YouTube Modal -->
    <div id="video-modal" class="modal" aria-hidden="true">
        <!-- YouTube Player -->
        <div class="modal-backdrop"></div>
        <div class="modal-content">
            <div id="player-container" class="player-container"></div>
        </div>
    </div>

    <script src="app.js"></script>

    <footer>
        <div class="footer-github">
            <a href="https://github.com/nov05/things-never-existed" target="_blank"
                title="Browse Things Never Existed on GitHub">
                <img src="assets/logo_github.png" class="footer-logo" alt="GitHub logo">
            </a>
            <a href="https://github.com/nov05" target="_blank" class="github-handle" title="Visit @nov05 on GitHub">
                @nov05
            </a>
        </div>
    </footer>

    <!-- Website Keyboard Hint -->
    <div id="keyboard-hint">Press ← → to navigate pages</div>
    <!-- YouTube Player Keyboard Hint -->
    <div id="player-keyboard-hint">
        <div class="player-hint-content">
            <div>ESC&nbsp;&nbsp;—&nbsp;&nbsp;Close player</div>
            <div class="player-hint-content-note">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;or click around the
                player to
                close</div>
            <div>↑&nbsp;&nbsp;—&nbsp;&nbsp;Previous video</div>
            <div>↓&nbsp;&nbsp;—&nbsp;&nbsp;Next video</div>
            <div class="player-hint-note">
                <span class="player-hint-note-icon">ⓘ</span>
                <span>These controls work only when you don't click the player. After clicking, use YouTube's
                    controls.</span>
            </div>
        </div>
    </div>
</body>

</html>
